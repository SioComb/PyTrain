<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>PyTrain 検定対策200問</title>
<meta name="description" content="基礎100問＋実践100問をオフラインで学べるPythonクイズアプリ">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PyTrain">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="icon" href="./icons/icon-192.png" sizes="192x192" type="image/png">

<style>
:root {
  --bg:#0f172a; --panel:#111827; --panel2:#1f2937; --text:#f8fafc;
  --muted:#cbd5e1; --accent:#38bdf8; --ok:#22c55e; --ng:#ef4444;
  --line:#334155;
}
* { box-sizing:border-box; }
body {
  margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;
  background:linear-gradient(180deg,#020617,#0f172a); color:var(--text);
  min-height:100vh; -webkit-text-size-adjust:100%;
}
button, select { font:inherit; }
.wrap { max-width:760px; margin:auto; padding:calc(16px + env(safe-area-inset-top)) calc(14px + env(safe-area-inset-right)) calc(40px + env(safe-area-inset-bottom)) calc(14px + env(safe-area-inset-left)); }
header { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:14px; }
h1 { font-size:22px; margin:0; }
.badge { font-size:12px; color:#082f49; background:#7dd3fc; padding:5px 9px; border-radius:999px; font-weight:700; }
.card { background:rgba(17,24,39,.96); border:1px solid var(--line); border-radius:18px; padding:16px; box-shadow:0 12px 30px rgba(0,0,0,.25); }
.grid { display:grid; gap:12px; }
.row { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
label { color:var(--muted); font-size:13px; display:grid; gap:6px; }
select { width:100%; padding:12px; border-radius:12px; border:1px solid var(--line); background:#0b1220; color:var(--text); }
.primary,.secondary,.choice {
  width:100%; border:0; border-radius:14px; padding:14px 15px; min-height:50px;
  cursor:pointer; touch-action:manipulation;
}
.primary { background:var(--accent); color:#082f49; font-weight:800; }
.secondary { background:#334155; color:var(--text); }
.choice { background:#1e293b; color:var(--text); border:1px solid #475569; text-align:left; }
.choice:active { transform:scale(.99); }
.choice.correct { border-color:var(--ok); background:rgba(34,197,94,.18); }
.choice.wrong { border-color:var(--ng); background:rgba(239,68,68,.18); }
.choice:disabled { opacity:1; cursor:default; }
.muted { color:var(--muted); }
.hidden { display:none !important; }
.topline { display:flex; justify-content:space-between; gap:10px; align-items:center; font-size:13px; color:var(--muted); }
.progress { height:9px; background:#334155; border-radius:99px; overflow:hidden; margin:10px 0 18px; }
.progress > div { height:100%; width:0; background:var(--accent); transition:width .2s; }
.q { font-size:18px; line-height:1.55; margin:0 0 14px; white-space:pre-wrap; }
.choices { display:grid; gap:10px; }
.explain { margin-top:14px; padding:13px; background:#0b1220; border-left:4px solid var(--accent); border-radius:10px; line-height:1.55; }
.actions { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:14px; }
.stat { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:14px 0; }
.stat div { background:#0b1220; border:1px solid var(--line); border-radius:12px; padding:12px 6px; text-align:center; }
.stat b { font-size:21px; display:block; }
.small { font-size:12px; }
.notice { margin-top:12px; font-size:12px; line-height:1.5; color:#94a3b8; }
code { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; color:#bae6fd; }
@media (max-width:520px) {
  .row,.actions { grid-template-columns:1fr; }
  .wrap { padding:12px 10px 30px; }
  .card { padding:14px; border-radius:15px; }
}
</style>
</head>
<body>
<div class="wrap">
<header><h1>🚃 PyTrain 検定対策</h1><span class="badge">OFFLINE 200問</span></header>

<section id="menu" class="card grid">
  <div>
    <h2 style="margin:0 0 6px;font-size:19px">学習モード</h2>
    <div class="muted small">基礎100問＋実践100問。端末内だけで動作します。</div>
  </div>
  <div class="row">
    <label>問題レベル
      <select id="level">
        <option value="basic">基礎試験クラス（100問）</option>
        <option value="practical">実践試験クラス（100問）</option>
        <option value="mixed">混合（200問）</option>
      </select>
    </label>
    <label>出題数
      <select id="count">
        <option value="10">10問</option>
        <option value="20">20問</option>
        <option value="40">40問</option>
        <option value="100">100問</option>
        <option value="all">全問</option>
      </select>
    </label>
  </div>
  <label>カテゴリ
    <select id="category"><option value="all">すべて</option></select>
  </label>
  <button id="start" class="primary">問題を開始</button>
  <button id="retryWrong" class="secondary">前回の間違いだけ復習</button>
  <div id="record" class="muted small"></div>
  <div class="notice">※公式試験問題の転載ではありません。公式出題範囲を参考に作成したオリジナル練習問題です。</div>
  <div id="pwaStatus" class="notice">Safariの共有メニューから「ホーム画面に追加」すると、アプリのように起動できます。</div>
</section>

<section id="quiz" class="card hidden">
  <div class="topline"><span id="meta"></span><span id="score"></span></div>
  <div class="progress"><div id="bar"></div></div>
  <h2 id="question" class="q"></h2>
  <div id="choices" class="choices"></div>
  <div id="explain" class="explain hidden"></div>
  <div class="actions">
    <button id="next" class="primary hidden">次の問題</button>
    <button id="quit" class="secondary">メニューへ戻る</button>
  </div>
</section>

<section id="result" class="card hidden">
  <h2 style="margin-top:0">結果</h2>
  <div class="stat">
    <div><b id="rScore">0</b><span class="small muted">正解</span></div>
    <div><b id="rRate">0%</b><span class="small muted">正答率</span></div>
    <div><b id="rWrong">0</b><span class="small muted">間違い</span></div>
  </div>
  <div id="message" class="explain"></div>
  <div class="actions">
    <button id="againWrong" class="primary">間違いを復習</button>
    <button id="back" class="secondary">メニューへ</button>
  </div>
</section>
</div>

<script>
const DATA = {"basic": [{"q": "Pythonでコメントを表す記号はどれ？", "choices": ["//", "#", "--", "/* */"], "answer": 1, "explanation": "`#` から行末までがコメントになります。", "category": "基本文法"}, {"q": "整数型を表す型名はどれ？", "choices": ["str", "float", "int", "bool"], "answer": 2, "explanation": "`int` は整数を表す組み込み型です。", "category": "データ型"}, {"q": "`type(3.0)` の結果はどれ？", "choices": ["int", "float", "str", "complex"], "answer": 1, "explanation": "小数点を含む数値リテラルは通常 `float` です。", "category": "データ型"}, {"q": "文字列を表す型名はどれ？", "choices": ["list", "str", "tuple", "dict"], "answer": 1, "explanation": "`str` は文字列型です。", "category": "データ型"}, {"q": "`bool(0)` の結果はどれ？", "choices": ["True", "False", "0", "None"], "answer": 1, "explanation": "数値の0は偽として評価されます。", "category": "真偽値"}, {"q": "`7 // 2` の結果はどれ？", "choices": ["3", "3.5", "4", "1"], "answer": 0, "explanation": "`//` は切り捨て除算です。", "category": "演算子"}, {"q": "`7 % 2` の結果はどれ？", "choices": ["0", "1", "2", "3"], "answer": 1, "explanation": "`%` は剰余演算子です。", "category": "演算子"}, {"q": "`2 ** 3` の結果はどれ？", "choices": ["6", "8", "9", "23"], "answer": 1, "explanation": "`**` はべき乗です。", "category": "演算子"}, {"q": "`'Py' + 'thon'` の結果はどれ？", "choices": ["Py thon", "Python", "Py+thon", "エラー"], "answer": 1, "explanation": "`+` で文字列を連結できます。", "category": "文字列"}, {"q": "`'ha' * 3` の結果はどれ？", "choices": ["hahaha", "ha3", "ha ha ha", "エラー"], "answer": 0, "explanation": "文字列に整数を掛けると繰り返されます。", "category": "文字列"}, {"q": "`len('Python')` の結果はどれ？", "choices": ["5", "6", "7", "エラー"], "answer": 1, "explanation": "`len()` は要素数・文字数を返します。", "category": "文字列"}, {"q": "`'Python'[0]` の結果はどれ？", "choices": ["P", "y", "n", "0"], "answer": 0, "explanation": "インデックスは0から始まります。", "category": "文字列"}, {"q": "`'Python'[-1]` の結果はどれ？", "choices": ["P", "y", "o", "n"], "answer": 3, "explanation": "負のインデックス -1 は末尾です。", "category": "文字列"}, {"q": "`'Python'[1:4]` の結果はどれ？", "choices": ["Pyt", "yth", "ytho", "tho"], "answer": 1, "explanation": "開始位置を含み、終了位置を含みません。", "category": "文字列"}, {"q": "文字列を大文字にするメソッドはどれ？", "choices": ["upper()", "big()", "capitalize_all()", "up()"], "answer": 0, "explanation": "`str.upper()` は全文字を大文字化します。", "category": "文字列"}, {"q": "文字列前後の空白を除去するメソッドはどれ？", "choices": ["trim()", "strip()", "remove()", "clean()"], "answer": 1, "explanation": "`strip()` は前後の空白などを除去します。", "category": "文字列"}, {"q": "`'a,b,c'.split(',')` の結果はどれ？", "choices": ["'abc'", "['a', 'b', 'c']", "('a','b','c')", "{'a','b','c'}"], "answer": 1, "explanation": "`split()` は区切り文字で分割したリストを返します。", "category": "文字列"}, {"q": "`'-'.join(['a','b'])` の結果はどれ？", "choices": ["a-b", "['a-b']", "ab-", "エラー"], "answer": 0, "explanation": "`join()` は文字列要素を区切り文字で連結します。", "category": "文字列"}, {"q": "リストを表す記号はどれ？", "choices": ["()", "[]", "{}", "<>"], "answer": 1, "explanation": "リストは角括弧で記述します。", "category": "リスト"}, {"q": "`[1,2,3][1]` の結果はどれ？", "choices": ["1", "2", "3", "エラー"], "answer": 1, "explanation": "インデックス1は2番目の要素です。", "category": "リスト"}, {"q": "リスト末尾に要素を追加するメソッドはどれ？", "choices": ["add()", "append()", "push()", "insert_end()"], "answer": 1, "explanation": "`append()` は末尾に1要素追加します。", "category": "リスト"}, {"q": "リスト末尾の要素を削除して返すメソッドはどれ？", "choices": ["pop()", "drop()", "delete()", "remove_last()"], "answer": 0, "explanation": "`pop()` は指定位置、未指定なら末尾を削除して返します。", "category": "リスト"}, {"q": "`[1,2] + [3,4]` の結果はどれ？", "choices": ["[1,2,3,4]", "[4,6]", "[[1,2],[3,4]]", "エラー"], "answer": 0, "explanation": "リスト同士の `+` は連結です。", "category": "リスト"}, {"q": "変更できないシーケンス型はどれ？", "choices": ["list", "tuple", "dict", "set"], "answer": 1, "explanation": "タプルはイミュータブルです。", "category": "タプル"}, {"q": "要素1個のタプルを正しく表すものはどれ？", "choices": ["(1)", "(1,)", "[1,]", "{1,}"], "answer": 1, "explanation": "1要素タプルには末尾のカンマが必要です。", "category": "タプル"}, {"q": "重複を持たない集合型はどれ？", "choices": ["list", "tuple", "set", "str"], "answer": 2, "explanation": "`set` は重複要素を持ちません。", "category": "集合"}, {"q": "空の集合を作る正しい方法はどれ？", "choices": ["{}", "set()", "[]", "()"], "answer": 1, "explanation": "`{}` は空の辞書なので、空集合は `set()` です。", "category": "集合"}, {"q": "辞書のキーと値を区切る記号はどれ？", "choices": ["=", ":", "->", ","], "answer": 1, "explanation": "辞書は `{キー: 値}` と記述します。", "category": "辞書"}, {"q": "`{'a': 1}['a']` の結果はどれ？", "choices": ["a", "1", "True", "エラー"], "answer": 1, "explanation": "キー `'a'` に対応する値は1です。", "category": "辞書"}, {"q": "辞書に存在しないキーを安全に取得しやすいメソッドはどれ？", "choices": ["get()", "find()", "read()", "search()"], "answer": 0, "explanation": "`get()` はキーがなければ既定値を返せます。", "category": "辞書"}, {"q": "条件分岐で使うキーワードはどれ？", "choices": ["when", "if", "switch", "case"], "answer": 1, "explanation": "Pythonの条件分岐は `if` です。", "category": "制御構文"}, {"q": "追加条件を表すキーワードはどれ？", "choices": ["elseif", "elif", "else if", "then"], "answer": 1, "explanation": "Pythonでは `elif` を使います。", "category": "制御構文"}, {"q": "どの条件にも該当しない場合を表すキーワードはどれ？", "choices": ["default", "otherwise", "else", "finally"], "answer": 2, "explanation": "`else` がその他の場合を処理します。", "category": "制御構文"}, {"q": "繰り返し処理で要素を順番に取り出す構文はどれ？", "choices": ["for", "loop", "each", "repeat"], "answer": 0, "explanation": "Pythonでは `for 変数 in iterable:` を使います。", "category": "制御構文"}, {"q": "条件が真の間繰り返す構文はどれ？", "choices": ["during", "while", "until", "repeat"], "answer": 1, "explanation": "`while` は条件が真の間繰り返します。", "category": "制御構文"}, {"q": "ループを途中で終了するキーワードはどれ？", "choices": ["stop", "exit", "break", "return"], "answer": 2, "explanation": "`break` は最も内側のループを終了します。", "category": "制御構文"}, {"q": "現在のループ処理だけを飛ばすキーワードはどれ？", "choices": ["skip", "continue", "pass", "next"], "answer": 1, "explanation": "`continue` は次の反復へ進みます。", "category": "制御構文"}, {"q": "何もしない文として使えるキーワードはどれ？", "choices": ["none", "pass", "skip", "empty"], "answer": 1, "explanation": "`pass` は構文上文が必要な場所で何もしません。", "category": "制御構文"}, {"q": "`range(3)` が生成する値はどれ？", "choices": ["1,2,3", "0,1,2", "0,1,2,3", "3のみ"], "answer": 1, "explanation": "終了値3は含まれません。", "category": "制御構文"}, {"q": "`list(range(1,5,2))` の結果はどれ？", "choices": ["[1,2,3,4]", "[1,3]", "[1,3,5]", "[2,4]"], "answer": 1, "explanation": "1から5未満まで2刻みなので `[1,3]` です。", "category": "制御構文"}, {"q": "関数を定義するキーワードはどれ？", "choices": ["function", "func", "def", "lambda"], "answer": 2, "explanation": "通常の関数定義には `def` を使います。", "category": "関数"}, {"q": "関数から値を返すキーワードはどれ？", "choices": ["yield", "return", "send", "output"], "answer": 1, "explanation": "`return` で呼び出し元へ値を返します。", "category": "関数"}, {"q": "戻り値を指定しない関数が返す値はどれ？", "choices": ["0", "False", "None", "空文字"], "answer": 2, "explanation": "明示的な `return` がなければ `None` を返します。", "category": "関数"}, {"q": "既定値引数として正しい記述はどれ？", "choices": ["def f(x: 1)", "def f(x=1)", "def f(x=>1)", "def f(default x=1)"], "answer": 1, "explanation": "`引数名=既定値` と書きます。", "category": "関数"}, {"q": "可変長位置引数を受け取る一般的な記述はどれ？", "choices": ["*args", "**args", "&args", "...args"], "answer": 0, "explanation": "`*args` は追加の位置引数をタプルで受け取ります。", "category": "関数"}, {"q": "可変長キーワード引数を受け取る一般的な記述はどれ？", "choices": ["*kwargs", "**kwargs", "&kwargs", "...kwargs"], "answer": 1, "explanation": "`**kwargs` は追加のキーワード引数を辞書で受け取ります。", "category": "関数"}, {"q": "無名関数を作るキーワードはどれ？", "choices": ["anon", "lambda", "func", "yield"], "answer": 1, "explanation": "`lambda` で小さな無名関数を作れます。", "category": "関数"}, {"q": "`lambda x: x * 2` を引数3で呼んだ結果はどれ？", "choices": ["3", "5", "6", "9"], "answer": 2, "explanation": "3を2倍するため6です。", "category": "関数"}, {"q": "リスト内包表記として正しいものはどれ？", "choices": ["[x*2 for x in range(3)]", "[for x in range(3): x*2]", "{x*2 where x}", "list(x*2, range(3))"], "answer": 0, "explanation": "基本形は `[式 for 変数 in iterable]` です。", "category": "内包表記"}, {"q": "`[x for x in range(5) if x % 2 == 0]` の結果はどれ？", "choices": ["[1,3,5]", "[0,2,4]", "[2,4]", "[0,1,2,3,4]"], "answer": 1, "explanation": "0から4までの偶数を抽出します。", "category": "内包表記"}, {"q": "例外処理を開始するキーワードはどれ？", "choices": ["try", "catch", "error", "except"], "answer": 0, "explanation": "`try` ブロック内で例外が起こり得る処理を実行します。", "category": "例外"}, {"q": "例外を捕捉するキーワードはどれ？", "choices": ["catch", "except", "handle", "rescue"], "answer": 1, "explanation": "Pythonでは `except` を使います。", "category": "例外"}, {"q": "例外の有無にかかわらず実行される節はどれ？", cursive()", "walkfiles()", "findall()"], "answer": 0, "explanation": "`Path.rglob()` は再帰的globです。", "category": "ファイル・ディレクトリ"}, {"q": "ファイル名だけを取得する `Path` 属性はどれ？", "choices": ["name", "filename", "basename", "leaf"], "answer": 0, "explanation": "`Path.name` は末尾のファイル名部分です。", "category": "ファイル・ディレクトリ"}, {"q": "拡張子を取得する `Path` 属性はどれ？", "choices": ["suffix", "extension", "ext", "ending"], "answer": 0, "explanation": "`Path.suffix` は最後の拡張子を返します。", "category": "ファイル・ディレクトリ"}, {"q": "拡張子なしのファイル名を取得する `Path` 属性はどれ？", "choices": ["stem", "root", "base", "title"], "answer": 0, "explanation": "`Path.stem` は末尾suffixを除いた名前です。", "category": "ファイル・ディレクトリ"}, {"q": "ファイルやディレクトリをコピーする標準モジュールはどれ？", "choices": ["shutil", "copyfilelib", "fs", "pathcopy"], "answer": 0, "explanation": "`shutil` は高水準のファイル操作を提供します。", "category": "ファイル・ディレクトリ"}, {"q": "ファイルが存在するか調べる `Path` メソッドはどれ？", "choices": ["exists()", "isthere()", "present()", "check()"], "answer": 0, "explanation": "`Path.exists()` が存在確認です。", "category": "ファイル・ディレクトリ"}, {"q": "テキストを簡潔に全読み込みする `Path` メソッドはどれ？", "choices": ["read_text()", "read_all()", "load_text()", "text()"], "answer": 0, "explanation": "`Path.read_text()` はファイルを開いて全文字列を返します。", "category": "ファイル・ディレクトリ"}, {"q": "バイナリデータを簡潔に書き込む `Path` メソッドはどれ？", "choices": ["write_bytes()", "write_binary()", "save_bytes()", "bytes_write()"], "answer": 0, "explanation": "`Path.write_bytes()` はbytesを書き込みます。", "category": "ファイル・ディレクトリ"}, {"q": "SQLiteを扱う標準モジュールはどれ？", "choices": ["sqlite3", "sqlite", "dbsqlite", "sql"], "answer": 0, "explanation": "`sqlite3` はDB-API 2.0準拠のSQLiteインターフェースです。", "category": "永続化"}, {"q": "SQL実行時に値を安全に渡す基本はどれ？", "choices": ["プレースホルダーを使う", "f文字列で直接埋め込む", "文字列連結する", "evalする"], "answer": 0, "explanation": "パラメータ化クエリはSQLインジェクション対策になります。", "category": "永続化"}, {"q": "オブジェクトをPython固有形式で直列化する標準モジュールはどれ？", "choices": ["pickle", "serial", "marshal_only", "objectdump"], "answer": 0, "explanation": "`pickle` はPythonオブジェクトの直列化を行います。信頼できないデータは読み込めません。", "category": "永続化"}, {"q": "INI形式の設定ファイルを扱う標準モジュールはどれ？", "choices": ["configparser", "iniparser", "settings", "config"], "answer": 0, "explanation": "`configparser` がINI風設定を扱います。", "category": "永続化"}, {"q": "ZIPアーカイブを扱う標準モジュールはどれ？", "choices": ["zipfile", "zip", "archivezip", "compress"], "answer": 0, "explanation": "`zipfile` はZIPの読み書きを提供します。", "category": "アーカイブ"}, {"q": "gzip形式を扱う標準モジュールはどれ？", "choices": ["gzip", "gz", "zipfile", "compresslib"], "answer": 0, "explanation": "`gzip` モジュールを使用します。", "category": "アーカイブ"}, {"q": "単体テスト用の標準フレームワークはどれ？", "choices": ["unittest", "pytest", "testlib", "doctest_only"], "answer": 0, "explanation": "`unittest` は標準ライブラリです。pytestはサードパーティです。", "category": "テスト"}, {"q": "モック機能を提供する標準モジュールはどれ？", "choices": ["unittest.mock", "mock.std", "testing.mock", "faker"], "answer": 0, "explanation": "`unittest.mock` に `Mock` や `patch` があります。", "category": "テスト"}, {"q": "関数のドキュメント文字列内の例をテストする標準モジュールはどれ？", "choices": ["doctest", "doccheck", "unittest.doc", "exampletest"], "answer": 0, "explanation": "`doctest` は対話例形式の記述を検証します。", "category": "テスト"}, {"q": "乱数を扱う標準モジュールはどれ？", "choices": ["random", "rand", "secrets_only", "statistics"], "answer": 0, "explanation": "一般用途の疑似乱数には `random` を使います。", "category": "その他標準ライブラリ"}, {"q": "パスワードやトークン用の安全な乱数に向くモジュールはどれ？", "choices": ["secrets", "random", "hashlib.random", "crypto"], "answer": 0, "explanation": "`secrets` は暗号学的に強い乱数を提供します。", "category": "その他標準ライブラリ"}, {"q": "ハッシュ値計算を行う標準モジュールはどれ？", "choices": ["hashlib", "hash", "checksum", "crypto_hash"], "answer": 0, "explanation": "`hashlib` はSHA-256などを提供します。", "category": "その他標準ライブラリ"}, {"q": "コマンドライン引数解析の標準モジュールはどれ？", "choices": ["argparse", "cli", "getargs_only", "sysparse"], "answer": 0, "explanation": "`argparse` はオプションやヘルプ生成を支援します。", "category": "その他標準ライブラリ"}, {"q": "UUIDを生成する標準モジュールはどれ？", "choices": ["uuid", "guid", "uniqueid", "ids"], "answer": 0, "explanation": "`uuid` モジュールがUUIDオブジェクトを提供します。", "category": "その他標準ライブラリ"}, {"q": "URLを扱う標準パッケージはどれ？", "choices": ["urllib", "requests", "httpx", "urltools"], "answer": 0, "explanation": "`urllib` は標準ライブラリです。requests/httpxはサードパーティです。", "category": "その他標準ライブラリ"}, {"q": "HTML特殊文字をエスケープする標準関数はどれ？", "choices": ["html.escape()", "str.escape_html()", "urllib.escape()", "xml.quote()"], "answer": 0, "explanation": "`html.escape()` は `&`, `<`, `>` などを変換します。", "category": "その他標準ライブラリ"}]};
const $ = id => document.getElementById(id);
let pool=[], current=[], index=0, correct=0, wrong=[];
let answered=false;

function shuffle(a) {
  a=[...a];
  for(let i=a.length-1;i>0;i--) {
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
function activeBank() {
  const level=$("level").value;
  if(level==="basic") return DATA.basic.map((q,i)=>({...q,id:"b"+i,level:"基礎"}));
  if(level==="practical") return DATA.practical.map((q,i)=>({...q,id:"p"+i,level:"実践"}));
  return [
    ...DATA.basic.map((q,i)=>({...q,id:"b"+i,level:"基礎"})),
    ...DATA.practical.map((q,i)=>({...q,id:"p"+i,level:"実践"}))
  ];
}
function fillCategories() {
  const selected=$("category").value;
  const cats=[...new Set(activeBank().map(q=>q.category))].sort();
  $("category").innerHTML='<option value="all">すべて</option>'+cats.map(c=>`<option value="${c}">${c}</option>`).join("");
  if(cats.includes(selected)) $("category").value=selected;
}
function loadRecord() {
  const rec=JSON.parse(localStorage.getItem("pytrain_record")||"{}");
  const attempts=rec.attempts||0, best=rec.best||0;
  $("record").textContent=`学習回数: ${attempts}回 / 最高正答率: ${best}%`;
  const hasWrong=(JSON.parse(localStorage.getItem("pytrain_wrong")||"[]")).length>0;
  $("retryWrong").disabled=!hasWrong;
  $("retryWrong").style.opacity=hasWrong?"1":".45";
}
function show(id) {
  ["menu","quiz","result"].forEach(x=>$(x).classList.toggle("hidden",x!==id));
}
function begin(list) {
  if(!list.length) { alert("該当する問題がありません。"); return; }
  current=shuffle(list);
  index=0; correct=0; wrong=[]; answered=false;
  show("quiz"); render();
}
function startQuiz() {
  pool=activeBank();
  const cat=$("category").value;
  if(cat!=="all") pool=pool.filter(q=>q.category===cat);
  const n=$("count").value==="all"?pool.length:Math.min(Number($("count").value),pool.length);
  begin(shuffle(pool).slice(0,n));
}
function render() {
  answered=false;
  const q=current[index];
  $("meta").textContent=`${q.level}・${q.category}　${index+1} / ${current.length}`;
  $("score").textContent=`正解 ${correct}`;
  $("bar").style.width=`${(index/current.length)*100}%`;
  $("question").textContent=q.q;
  $("explain").classList.add("hidden");
  $("next").classList.add("hidden");
  $("choices").innerHTML="";
  q.choices.forEach((c,i)=>{
    const b=document.createElement("button");
    b.className="choice";
    b.textContent=`${"ABCD"[i]}. ${c}`;
    b.addEventListener("click",()=>answer(i));
    $("choices").appendChild(b);
  });
}
function answer(choice) {
  if(answered) return;
  answered=true;
  const q=current[index];
  const buttons=[...$("choices").children];
  buttons.forEach((b,i)=>{
    b.disabled=true;
    if(i===q.answer) b.classList.add("correct");
    if(i===choice && i!==q.answer) b.classList.add("wrong");
  });
  if(choice===q.answer) correct++;
  else wrong.push(q);
  $("score").textContent=`正解 ${correct}`;
  $("explain").innerHTML=`<b>${choice===q.answer?"正解！":"不正解"}</b><br>${q.explanation}`;
  $("explain").classList.remove("hidden");
  $("next").textContent=index===current.length-1?"結果を見る":"次の問題";
  $("next").classList.remove("hidden");
  $("bar").style.width=`${((index+1)/current.length)*100}%`;
}
function next() {
  if(index<current.length-1) { index++; render(); } else finish();
}
function finish() {
  const rate=Math.round(correct/current.length*100);
  $("rScore").textContent=`${correct} / ${current.length}`;
  $("rRate").textContent=rate+"%";
  $("rWrong").textContent=wrong.length;
  $("message").textContent=rate>=90?"かなり仕上がっています。弱点カテゴリだけ復習しましょう。":
    rate>=70?"合格圏です。間違えた問題を復習すると安定します。":
    "まだ伸びしろがあります。解説を確認して再挑戦しましょう。";
  localStorage.setItem("pytrain_wrong",JSON.stringify(wrong));
  const rec=JSON.parse(localStorage.getItem("pytrain_record")||"{}");
  rec.attempts=(rec.attempts||0)+1;
  rec.best=Math.max(rec.best||0,rate);
  localStorage.setItem("pytrain_record",JSON.stringify(rec));
  $("againWrong").disabled=wrong.length===0;
  $("againWrong").style.opacity=wrong.length?"1":".45";
  show("result"); loadRecord();
}
$("level").addEventListener("change",fillCategories);
$("start").addEventListener("click",startQuiz);
$("next").addEventListener("click",next);
$("quit").addEventListener("click",()=>{show("menu");loadRecord();});
$("back").addEventListener("click",()=>{show("menu");loadRecord();});
$("retryWrong").addEventListener("click",()=>{
  const saved=JSON.parse(localStorage.getItem("pytrain_wrong")||"[]");
  begin(saved);
});
$("againWrong").addEventListener("click",()=>begin(wrong));
fillCategories(); loadRecord();
</script>

<script>
(function () {
  const status = document.getElementById("pwaStatus");
  const standalone = window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;
  if (standalone && status) {
    status.textContent = "ホーム画面アプリとして起動中です。学習データはこの端末内に保存されます。";
  }

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", async () => {
      try {
        await navigator.serviceWorker.register("./sw.js", { scope: "./" });
      } catch (error) {
        console.warn("Service Worker registration failed:", error);
        if (status && location.protocol !== "file:") {
          status.textContent = "オフライン準備に失敗しました。HTTPSで公開されているか確認してください。";
        }
      }
    });
  }
})();
</script>
