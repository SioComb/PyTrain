<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>PyTrain 検定対策400問</title>
<meta name="description" content="基礎183問＋実践217問をオフラインで学べるPythonクイズアプリ">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PyTrain">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="icon" href="./icons/icon-192.png" sizes="192x192" type="image/png">
<style>
:root { --bg:#0f172a; --panel:#111827; --panel2:#1f2937; --text:#f8fafc; --muted:#cbd5e1; --accent:#38bdf8; --ok:#22c55e; --ng:#ef4444; --line:#334155; }
* { box-sizing:border-box; }
body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif; background:linear-gradient(180deg,#020617,#0f172a); color:var(--text); min-height:100vh; -webkit-text-size-adjust:100%; }
button, select, input { font:inherit; }
.wrap { max-width:760px; margin:auto; padding:calc(16px + env(safe-area-inset-top)) calc(14px + env(safe-area-inset-right)) calc(40px + env(safe-area-inset-bottom)) calc(14px + env(safe-area-inset-left)); }
header { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:14px; }
h1 { font-size:22px; margin:0; }
.badge { font-size:12px; color:#082f49; background:#7dd3fc; padding:5px 9px; border-radius:999px; font-weight:700; }
.card { background:rgba(17,24,39,.96); border:1px solid var(--line); border-radius:18px; padding:16px; box-shadow:0 12px 30px rgba(0,0,0,.25); }
.grid { display:grid; gap:12px; }
.row { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
label { color:var(--muted); font-size:13px; display:grid; gap:6px; }
select { width:100%; padding:12px; border-radius:12px; border:1px solid var(--line); background:#0b1220; color:var(--text); }
.option-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.check-option { display:flex; align-items:center; gap:10px; min-height:48px; padding:11px 12px; border:1px solid var(--line); border-radius:12px; background:#0b1220; color:var(--text); cursor:pointer; }
.check-option input { width:20px; height:20px; margin:0; accent-color:var(--accent); }
.primary,.secondary,.choice { width:100%; border:0; border-radius:14px; padding:14px 15px; min-height:50px; cursor:pointer; touch-action:manipulation; }
.primary { background:var(--accent); color:#082f49; font-weight:800; }
.secondary { background:#334155; color:var(--text); }
.choice { background:#1e293b; color:var(--text); border:1px solid #475569; text-align:left; }
.choice:active { transform:scale(.99); }
.choice.correct { border-color:var(--ok); background:rgba(34,197,94,.18); }
.choice.wrong { border-color:var(--ng); background:rgba(239,68,68,.18); }
.choice:disabled { opacity:1; cursor:default; }
.muted { color:var(--muted); }
.hidden { display:none !important; }
.topline { display:flex; justify-content:space-between; gap:10px; align-items:center; font-size:13px; color:var(--muted); }
.progress { height:9px; background:#334155; border-radius:99px; overflow:hidden; margin:10px 0 18px; }
.progress > div { height:100%; width:0; background:var(--accent); transition:width .2s; }
.q { font-size:18px; line-height:1.55; margin:0 0 14px; white-space:pre-wrap; }
.choices { display:grid; gap:10px; }
.explain { margin-top:14px; padding:13px; background:#0b1220; border-left:4px solid var(--accent); border-radius:10px; line-height:1.55; }
.actions { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:14px; }
.stat { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:14px 0; }
.stat div { background:#0b1220; border:1px solid var(--line); border-radius:12px; padding:12px 6px; text-align:center; }
.stat b { font-size:21px; display:block; }
.rank-card { display:grid; grid-template-columns:auto 1fr; gap:12px; align-items:center; padding:13px; border:1px solid #475569; border-radius:14px; background:linear-gradient(135deg,rgba(56,189,248,.16),rgba(15,23,42,.65)); }
.rank-symbol { min-width:58px; text-align:center; font-size:30px; line-height:1; font-weight:900; color:#7dd3fc; }
.rank-title { font-weight:800; }
.rank-detail { margin-top:4px; }
.small { font-size:12px; }
.notice { margin-top:12px; font-size:12px; line-height:1.5; color:#94a3b8; }
code { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; color:#bae6fd; }
@media (max-width:520px) {
  .row,.actions,.option-grid { grid-template-columns:1fr; }
  .wrap { padding:calc(20px + env(safe-area-inset-top)) 10px calc(24px + env(safe-area-inset-bottom)); }
  header { margin-bottom:16px; }
  .card { padding:14px; border-radius:15px; }
  #quiz { min-height:calc(100dvh - 112px - env(safe-area-inset-top) - env(safe-area-inset-bottom)); display:flex; flex-direction:column; }
  #quiz .choices { margin-top:auto; }
  #quiz .choice { min-height:64px; padding:16px 15px; }
  #quiz .actions .secondary, #quiz .actions .primary { min-height:58px; }
}
</style>
</head>
<body>
<div class="wrap">
<header><h1>🚃 PyTrain 検定対策</h1><span class="badge">OFFLINE 400問</span></header>
<section id="menu" class="card grid">
  <div><h2 style="margin:0 0 6px;font-size:19px">学習モード</h2><div class="muted small">基礎183問＋実践217問。端末内だけで動作します。</div></div>
  <div id="rankCard" class="rank-card">
    <div id="rankSymbol" class="rank-symbol">-</div>
    <div><div id="rankTitle" class="rank-title">未判定</div><div id="rankDetail" class="rank-detail muted small">問題を解くと総合評価が記録されます。</div></div>
  </div>
  <div class="row">
    <label>問題レベル<select id="level"><option value="basic">基礎試験クラス（183問）</option><option value="practical">実践試験クラス（217問）</option><option value="mixed">混合（400問）</option></select></label>
    <label>出題数<select id="count"><option value="10">10問</option><option value="20">20問</option><option value="40">40問</option><option value="100">100問</option><option value="200">200問</option><option value="all">全問</option></select></label>
  </div>
  <label>カテゴリ<select id="category"><option value="all">すべて</option></select></label>
  <div class="option-grid">
    <label class="check-option"><input id="unansweredOnly" type="checkbox"><span>未回答のみ出題</span></label>
    <label class="check-option"><input id="randomChoices" type="checkbox"><span>選択肢の順序ランダム</span></label>
  </div>
  <button id="start" class="primary">問題を開始</button>
  <button id="retryWrong" class="secondary">前回の間違いだけ復習</button>
  <div id="record" class="muted small"></div>
  <div class="notice">※公式試験問題の転載ではありません。公式出題範囲を参考に作成したオリジナル練習問題です。</div>
  <div id="pwaStatus" class="notice">Safariの共有メニューから「ホーム画面に追加」すると、アプリのように起動できます。</div>
</section>
<section id="quiz" class="card hidden">
  <div class="topline"><span id="meta"></span><span id="score"></span></div>
  <div class="progress"><div id="bar"></div></div>
  <h2 id="question" class="q"></h2>
  <div id="choices" class="choices"></div>
  <div id="explain" class="explain hidden"></div>
  <div class="actions"><button id="next" class="primary hidden">次の問題</button><button id="quit" class="secondary">メニューへ戻る</button></div>
</section>
<section id="result" class="card hidden">
  <h2 style="margin-top:0">結果</h2>
  <div class="stat"><div><b id="rScore">0</b><span class="small muted">正解</span></div><div><b id="rRate">0%</b><span class="small muted">正答率</span></div><div><b id="rWrong">0</b><span class="small muted">間違い</span></div></div>
  <div id="resultRank" class="rank-card"><div id="resultRankSymbol" class="rank-symbol">-</div><div><div id="resultRankTitle" class="rank-title">未判定</div><div id="resultRankDetail" class="rank-detail muted small"></div></div></div>
  <div id="message" class="explain"></div>
  <div class="actions"><button id="againWrong" class="primary">間違いを復習</button><button id="back" class="secondary">メニューへ</button></div>
</section>
</div>
<script type="module" src="./bootstrap.js"></script>
<script>
(function(){const status=document.getElementById("pwaStatus");const standalone=window.matchMedia("(display-mode: standalone)").matches||window.navigator.standalone===true;if(standalone&&status)status.textContent="ホーム画面アプリとして起動中です。学習データはこの端末内に保存されます。";if("serviceWorker" in navigator)window.addEventListener("load",async()=>{try{await navigator.serviceWorker.register("./sw.js",{scope:"./"});}catch(error){console.warn("Service Worker registration failed:",error);if(status&&location.protocol!=="file:")status.textContent="オフライン準備に失敗しました。HTTPSで公開されているか確認してください。";}});})();
</script>
</body>
</html>
